<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новости Армении</title>
<meta name="description" content="Ежедневная сводка новостей Армении: политика, безопасность, экономика, общество, регион, культура.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Armenian:wght@600&family=Source+Sans+3:wght@400;600&display=swap">

<!-- Сюда вставляется код счётчика (Яндекс Метрика или Google Analytics), если он нужен. -->

<style>
/* Layout: masthead with Armenian script, lead story beside a digest, economy figures, filterable dated feed with archive. */
:root {
  color-scheme: light dark;
  --bg: #F2F1F4;
  --surface: #FFFFFF;
  --fg: #1C1B24;
  --muted: #5F5C6B;
  --line: #D9D6E0;
  --accent: #A3132F;
  --blue: #24406B;
  --font-display: "Alegreya", "Georgia", "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-arm: "Noto Serif Armenian", "Sylfaen", var(--font-display);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14131A; --surface: #1D1C25; --fg: #ECEAF1; --muted: #A5A2B3;
    --line: #34323F; --accent: #F0647D; --blue: #8DB0E6;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  padding: 0 16px 48px;
}
a { color: inherit; }
button, select { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; }

.masthead { padding-block: 28px 14px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
.arm { font-family: var(--font-arm); font-weight: 600; font-size: 15px; letter-spacing: .06em; color: var(--accent); margin: 0; }
.masthead h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1; letter-spacing: -.01em; margin: 4px 0 0; text-wrap: balance; }
.dateline { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin: 0; text-align: right; }
.carpet {
  height: 12px;
  background: conic-gradient(from 45deg at 50% 50%, var(--accent) 0 25%, var(--blue) 0 50%, var(--accent) 0 75%, var(--blue) 0) 0 0 / 12px 12px;
  opacity: .9;
  border-block: 1px solid var(--line);
  margin-inline: -16px;
}

.lead { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 32px; padding-block: 32px; }
.kicker { font-family: var(--font-mono); font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin: 0 0 10px; }
.lead h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 5vw, 3.1rem); line-height: 1.08; margin: 0 0 16px; text-wrap: balance; }
.lead p { margin: 0 0 12px; max-width: 62ch; }
.src { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }

.digest { border-left: 1px solid var(--line); padding-left: 24px; min-width: 0; }
.digest h3 { font-family: var(--font-mono); font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 14px; font-weight: 500; }
.digest ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.digest li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; font-size: 16px; line-height: 1.4; }
.digest time { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); padding-top: 2px; }

.econ { padding-block: 8px 36px; }
.sec-title { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0 0 4px; }
.sec-note { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--line); padding: 16px; min-width: 0; }
.fig b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 2.3rem; line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; }
.fig span { display: block; margin-top: 8px; font-size: 14.5px; line-height: 1.35; }
.fig i { display: block; margin-top: 6px; font-style: normal; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

.feed-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--fg); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { cursor: pointer; font-size: 14.5px; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px; }
.filters button:hover { border-color: var(--fg); }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.day { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.day select { color: var(--fg); background: var(--surface); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; max-width: 100%; }

.stories { list-style: none; margin: 0; padding: 0; }
.story { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 24px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.story[hidden] { display: none; }
.meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.tag { text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.story h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
.story p { margin: 0 0 8px; max-width: 66ch; }
.empty { padding-block: 28px; color: var(--muted); }

.more { margin-top: 10px; }
.more summary { cursor: pointer; list-style: none; display: inline-block; padding: 4px 0; font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: " ↓"; }
.more[open] summary::after { content: " ↑"; }
.more .body { margin-top: 8px; padding-left: 16px; border-left: 3px solid var(--line); display: grid; gap: 12px; }
.more .body p { margin: 0; max-width: 66ch; }

footer { padding-top: 32px; color: var(--muted); font-size: 15px; }
footer h2 { font-family: var(--font-display); font-size: 1.3rem; color: var(--fg); margin: 0 0 10px; }
footer p { margin: 0 0 12px; }

@media (max-width: 760px) {
  .lead { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .digest { border-left: 0; border-top: 1px solid var(--line); padding: 20px 0 0; }
  .dateline { text-align: left; }
  .story { grid-template-columns: minmax(0, 1fr); }
  .meta { flex-direction: row; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <p class="arm" lang="hy">Հայաստան</p>
      <h1>Новости Армении</h1>
    </div>
    <p class="dateline" id="dateline"></p>
  </header>
</div>
<div class="carpet" role="presentation"></div>

<main class="wrap">
  <section class="lead" aria-labelledby="lead-h" id="lead"></section>
  <section class="econ" aria-labelledby="econ-h" id="econ"></section>

  <section aria-labelledby="feed-h">
    <div class="feed-head">
      <h2 class="sec-title" id="feed-h">Лента</h2>
      <div class="tools">
        <label class="day" for="day"><span>Выпуск</span><select id="day"><option value="all">Все даты</option></select></label>
        <div class="filters" id="filters" role="group" aria-label="Рубрики"></div>
      </div>
    </div>
    <ul class="stories" id="stories"></ul>
  </section>

  <footer>
    <h2>Источники</h2>
    <p id="sources"></p>
    <p>Новости собраны из открытых источников и пересказаны своими словами.</p>
  </footer>
</main>

<script>
(function () {
  var CATEGORY_ORDER = ['Политика', 'Безопасность', 'Экономика', 'Общество', 'Регион', 'Культура'];
  var state = { cat: 'all', day: 'all' };
  var items = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var dateFmt = null;
  try { dateFmt = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'long', timeZone: 'UTC' }); } catch (e) {}
  function fmtDate(iso) {
    return dateFmt ? dateFmt.format(new Date(iso + 'T00:00:00Z')) : iso;
  }

  function renderLead(lead, digest) {
    var host = document.getElementById('lead');
    var art = el('article');
    art.appendChild(el('p', 'kicker', lead.kicker));
    var h = el('h2', null, lead.title);
    h.id = 'lead-h';
    art.appendChild(h);
    (lead.paragraphs || []).forEach(function (t) { art.appendChild(el('p', null, t)); });
    art.appendChild(el('p', 'src', 'Источники: ' + lead.sources));
    host.appendChild(art);

    var aside = el('aside', 'digest');
    aside.setAttribute('aria-labelledby', 'digest-h');
    var dh = el('h3', null, 'Главное за два дня');
    dh.id = 'digest-h';
    aside.appendChild(dh);
    var ol = el('ol');
    (digest || []).forEach(function (d) {
      var li = el('li');
      li.appendChild(el('time', null, d.date));
      li.appendChild(el('span', null, d.text));
      ol.appendChild(li);
    });
    aside.appendChild(ol);
    host.appendChild(aside);
  }

  function renderEconomy(econ) {
    var host = document.getElementById('econ');
    var h = el('h2', 'sec-title', 'Экономика в цифрах');
    h.id = 'econ-h';
    host.appendChild(h);
    host.appendChild(el('p', 'sec-note', econ.note));
    var wrap = el('div', 'figures');
    (econ.figures || []).forEach(function (f) {
      var box = el('div', 'fig');
      box.appendChild(el('b', null, f.value));
      box.appendChild(el('span', null, f.label));
      box.appendChild(el('i', null, f.source));
      wrap.appendChild(box);
    });
    host.appendChild(wrap);
  }

  function renderStories(stories) {
    var ul = document.getElementById('stories');
    stories.forEach(function (s) {
      var li = el('li', 'story');
      li.setAttribute('data-cat', s.category);
      li.setAttribute('data-added', s.added);
      var meta = el('div', 'meta');
      meta.appendChild(el('span', null, s.date));
      meta.appendChild(el('span', 'tag', s.category));
      li.appendChild(meta);
      var box = el('div');
      box.appendChild(el('h3', null, s.title));
      box.appendChild(el('p', null, s.summary));
      if (s.body && s.body.length) {
        var det = el('details', 'more');
        det.appendChild(el('summary', null, 'Читать полностью'));
        var body = el('div', 'body');
        s.body.forEach(function (t) { body.appendChild(el('p', null, t)); });
        det.appendChild(body);
        box.appendChild(det);
      }
      box.appendChild(el('span', 'src', s.source));
      li.appendChild(box);
      ul.appendChild(li);
      items.push(li);
    });
    var empty = el('li', 'empty', 'По выбранным условиям новостей нет.');
    empty.id = 'empty';
    empty.hidden = true;
    ul.appendChild(empty);
  }

  function renderFilters(stories) {
    var host = document.getElementById('filters');
    var present = {};
    stories.forEach(function (s) { present[s.category] = true; });
    var cats = ['all'].concat(CATEGORY_ORDER.filter(function (c) { return present[c]; }));
    Object.keys(present).forEach(function (c) { if (cats.indexOf(c) < 0) cats.push(c); });
    cats.forEach(function (c) {
      var b = el('button', null, c === 'all' ? 'Все' : c);
      b.type = 'button';
      b.setAttribute('data-filter', c);
      b.setAttribute('aria-pressed', c === 'all' ? 'true' : 'false');
      b.addEventListener('click', function () {
        state.cat = c;
        host.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        apply();
      });
      host.appendChild(b);
    });
  }

  function renderDays(stories) {
    var sel = document.getElementById('day');
    var days = [];
    stories.forEach(function (s) { if (s.added && days.indexOf(s.added) < 0) days.push(s.added); });
    days.sort().reverse();
    days.forEach(function (d, i) {
      var o = el('option', null, (i === 0 ? 'Последний выпуск, ' : '') + fmtDate(d));
      o.value = d;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () { state.day = sel.value; apply(); });
  }

  function apply() {
    var shown = 0;
    items.forEach(function (it) {
      var ok = (state.cat === 'all' || it.getAttribute('data-cat') === state.cat) &&
               (state.day === 'all' || it.getAttribute('data-added') === state.day);
      it.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById('empty').hidden = shown !== 0;
  }

  function fail() {
    var ul = document.getElementById('stories');
    ul.appendChild(el('li', 'empty', 'Не удалось загрузить новости. Откройте сайт через хостинг или локальный сервер: при открытии файла двойным щелчком браузер не читает news.json.'));
  }

  fetch('news.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      document.getElementById('dateline').textContent = 'Сводка на ' + fmtDate(data.updated) + ' ' + data.updated.slice(0, 4);
      renderLead(data.lead, data.digest);
      renderEconomy(data.economy);
      renderFilters(data.stories);
      renderDays(data.stories);
      renderStories(data.stories);
      document.getElementById('sources').textContent = data.sources;
      apply();
    })
    .catch(fail);
})();
</script>
</body>
</html>
